<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>برنامج دليل منح الائتمان</title>
<style>
:root{
  --bg:#f5f4ef; --surface:#ffffff; --surface2:#efede6; --ink:#1f1e1b; --muted:#6b675f; --line:#dcd8cd;
  --accent:#0f5c4d; --accent-ink:#ffffff; --accentSoft:#dcebe6;
  --b:#1d5fa8; --bSoft:#dde8f5; --c:#a33b21; --cSoft:#f6e1da; --d:#6b4aa0; --dSoft:#e9e2f4;
  --ok:#2f7a3b; --okSoft:#e0f0e2; --err:#b3261e; --errSoft:#fbe3e1; --warn:#8a6200; --warnSoft:#fbf0d4;
  --r:12px; --font:"Segoe UI",Tahoma,"Noto Naskh Arabic","Noto Sans Arabic","Geeza Pro",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#161614; --surface:#1f1f1c; --surface2:#2a2925; --ink:#ecebe6; --muted:#a29e94; --line:#3a3933;
  --accent:#4fb39d; --accent-ink:#0d1f1b; --accentSoft:#1e3a33;
  --b:#7fb0ea; --bSoft:#1d2c3f; --c:#ec8e74; --cSoft:#3d2520; --d:#b7a0e0; --dSoft:#2d2540;
  --ok:#7fcf8a; --okSoft:#1c3320; --err:#f2877f; --errSoft:#3d1f1d; --warn:#e6c065; --warnSoft:#3a3019;
}}
:root[data-theme="dark"]{
  --bg:#161614; --surface:#1f1f1c; --surface2:#2a2925; --ink:#ecebe6; --muted:#a29e94; --line:#3a3933;
  --accent:#4fb39d; --accent-ink:#0d1f1b; --accentSoft:#1e3a33;
  --b:#7fb0ea; --bSoft:#1d2c3f; --c:#ec8e74; --cSoft:#3d2520; --d:#b7a0e0; --dSoft:#2d2540;
  --ok:#7fcf8a; --okSoft:#1c3320; --err:#f2877f; --errSoft:#3d1f1d; --warn:#e6c065; --warnSoft:#3a3019;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6}
body{overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.copyf{text-align:center;color:var(--muted);font-size:12.5px;padding:10px 16px 26px}
/* lock */
#lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.lockbox{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px 22px;width:100%;max-width:380px;text-align:center}
.lockbox h1{font-size:21px;margin:6px 0 4px}
.lockbox p{color:var(--muted);margin:0 0 18px;font-size:14px}
.seal{width:56px;height:56px;border-radius:50%;background:var(--accentSoft);color:var(--accent);display:inline-flex;align-items:center;justify-content:center}
/* app */
header.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:10px;padding:10px 16px;max-width:1180px;margin:0 auto}
.bar #vpill,.bar #ipill{flex:none}
.bar h1{font-size:16px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 11px;font-size:13px;font-weight:600;white-space:nowrap}
.pA{background:var(--accentSoft);color:var(--accent)} .pB{background:var(--bSoft);color:var(--b)} .pC{background:var(--cSoft);color:var(--c)} .pD{background:var(--dSoft);color:var(--d)}
.pok{background:var(--okSoft);color:var(--ok)} .perr{background:var(--errSoft);color:var(--err)} .pwarn{background:var(--warnSoft);color:var(--warn)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding:0 12px 8px;max-width:1180px;margin:0 auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:transparent;padding:7px 13px;border-radius:9px;white-space:nowrap;color:var(--muted);font-weight:600}
nav.tabs button.on{background:var(--ink);color:var(--bg)}
main{max-width:1180px;margin:0 auto;padding:16px}
h2{font-size:19px;margin:6px 0 12px}
h3{font-size:16px;margin:0 0 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.vcard{border:2px solid var(--line);border-radius:var(--r);padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.vcard.on{border-color:var(--accent)}
.vcard .t{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px}
.vcard p{margin:0;color:var(--muted);font-size:13.5px;flex:1}
.letter{width:32px;height:32px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;font-weight:800}
.btn{border:1px solid var(--line);background:var(--surface2);padding:8px 14px;border-radius:10px;font-weight:600}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--err)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
label.f > span{font-weight:600}
select,input[type=text],input[type=number],input[type=password],textarea{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%;color:var(--ink);min-width:0}
textarea{min-height:170px;resize:vertical;line-height:1.7}
.seg{display:inline-flex;background:var(--surface2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table.t{border-collapse:collapse;width:100%;font-size:13.5px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:right;vertical-align:middle;white-space:nowrap}
table.t thead th{background:var(--surface2);font-weight:700;position:sticky;top:0}
table.t td.bad{background:var(--errSoft);color:var(--err);font-weight:700}
table.t td.num{font-variant-numeric:tabular-nums}
table.t td select{display:block;min-width:140px}
.delta{font-size:11.5px;display:block}
.up{color:var(--ok)} .down{color:var(--err)}
.issues{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:420px;overflow:auto}
.issues li{padding:8px 10px;border-radius:9px;font-size:13.5px;background:var(--errSoft);color:var(--ink);border-inline-start:4px solid var(--err)}
.issues li.warn{background:var(--warnSoft);border-color:var(--warn)}
.tag{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:99px;background:var(--dSoft);color:var(--d);margin-inline-start:6px;font-weight:700}
.muted{color:var(--muted)} .small{font-size:13px}
.ranklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ranklist li{display:flex;align-items:center;gap:8px;background:var(--surface2);border-radius:10px;padding:6px 8px}
.ranklist .n{width:28px;height:28px;border-radius:8px;background:var(--ink);color:var(--bg);display:inline-flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.ranklist input{flex:1;background:var(--surface)}
.note{background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:13.5px;color:var(--muted)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;z-index:50;font-weight:600;max-width:92vw;text-align:center}
.exl{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.exl li{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.exl li.off{opacity:.55}
.exl .d{flex:1;min-width:200px}
.params td input{width:80px;padding:5px 6px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-size:22px}
.preview{background:#fff;color:#1a1a1a;border-radius:10px;padding:0;overflow:auto;border:1px solid var(--line)}
#print{display:none}
/* ===== Guide (print & preview) ===== */
.guide{font-family:var(--font);color:#1a1a1a;background:#fff;font-size:12px;line-height:1.65}
.guide .pg{padding:18px 22px;page-break-after:always;break-after:page}
.guide .pg:last-child{page-break-after:auto;break-after:auto}
.guide .cover{min-height:170mm;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px;border:3px double #0f5c4d;border-radius:6px}
.guide .cover h1{font-size:30px;margin:0;color:#0f5c4d}
.guide .cover .v{font-size:22px;font-weight:800;padding:6px 22px;border-radius:8px;color:#fff}
.guide .ghead{display:flex;justify-content:space-between;border-bottom:2px solid #0f5c4d;padding-bottom:4px;margin-bottom:10px;font-size:11px;color:#555}
.guide h2{font-size:17px;color:#0f5c4d;margin:4px 0 8px}
.guide h3{font-size:14px;margin:12px 0 6px;color:#222}
.guide ul{margin:0;padding-inline-start:20px}
.guide li{margin-bottom:3px}
.guide table{border-collapse:collapse;width:100%;margin:4px 0 10px;font-size:11px}
.guide th,.guide td{border:1px solid #9a9a9a;padding:4px 6px;text-align:center;vertical-align:middle}
.guide th{background:#e3efeb;font-weight:700}
.guide td.l{text-align:right}
.guide .rk{display:inline-block;background:#0f5c4d;color:#fff;border-radius:4px;padding:0 7px;margin-inline-end:4px;font-weight:700}
.guide .box{border:1px solid #bbb;border-radius:6px;padding:8px 10px;background:#f7f7f4;margin:6px 0}
.guide .ok{color:#2f7a3b;font-weight:700} .guide .bad{color:#b3261e;font-weight:700}
.guide .na{color:#999}
@media print{
  @page{size:A4 landscape;margin:10mm}
  body{background:#fff}
  body > *:not(#print){display:none!important}
  #print{display:block!important}
  .guide .pg{padding:0}
  .guide .cover{min-height:180mm}
  .guide th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .guide .cover .v,.guide .rk{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (max-width:560px){ main{padding:12px 12px} .bar{flex-wrap:wrap} .bar h1{flex-basis:100%} .card{padding:13px} .bar{padding:10px 12px} }
</style>
</head>

    <nav class="tabs" id="tabs"></nav>
  </header>

</div>

var GUAR = ['لا يوجد', 'تعهد بتحويل مكافأة نهاية الخدمة', 'تغطية مكافأة نهاية الخدمة 60% من المديونية', 'كفيل كويتي يعمل في الحكومة', 'ضمان مالي بكامل قيمة العقد'];
var BANK = { 1: 'تحويل راتب إلى بيتك فقط', 2: 'تحويل راتب أو تحويل بنوك (أوامر دائمة)' };
var VNAMES = { A: 'النسخة (أ) الأساسية', B: 'النسخة (ب) المخففة', C: 'النسخة (ج) المشددة', D: 'النسخة المخصصة' };
// dir: +1 = القيمة الأكبر أفضل للعميل، -1 = الأصغر أفضل
var FIELDS = {
  allowed: { l: 'السماح بالتمويل', d: 1 },
  bank: { l: 'بنك الراتب', d: 1 },
  minSalary: { l: 'الحد الأدنى للراتب', d: -1 },
  minService: { l: 'الحد الأدنى لمدة الخدمة', d: -1 },
  regularity: { l: 'أشهر انتظام الراتب', d: -1 },
  maxAge: { l: 'السن القصوى', d: 1 },
  dbr: { l: 'نسبة الاستقطاع', d: 1 },
  guarantee: { l: 'الضمان المطلوب', d: -1 },
  card: { l: 'حد البطاقة الائتمانية', d: 1 },
};
var TIERN = ['أقل من 3 سنوات', '3 إلى أقل من 5 سنوات', '5 سنوات فأكثر'];

function clone(o) { return JSON.parse(JSON.stringify(o)); }
function K(n, e) { return n + '|' + e; }
function r500(x) { return Math.round(x / 500) * 500; }
function f500(x) { return Math.floor(x / 500) * 500; }
function r50(x) { return Math.round(x / 50) * 50; }
function natName(st, id) { var n = st.nats.find(function (x) { return x.id === id; }); return n ? n.name : id; }
function empName(st, id) { var n = st.emps.find(function (x) { return x.id === id; }); return n ? n.name : id; }

function mapTiers(s, fn) {
  ['b1', 'b2'].forEach(function (b) {
    s.tiers[b] = s.tiers[b].map(function (x, ti) { return fn(x[0], x[1], ti, b); });
  });
}

function buildVersion(st, v) {
  if (v === 'A') return clone(st.base);
  if (v === 'D') return clone(st.custom || st.base);
  var out = clone(st.base), p = st.params[v], c = st.caps;
  st.nats.forEach(function (n, ni) {
    st.emps.forEach(function (e, ei) {
      var s = out[K(n.id, e.id)];
      if (!s) return;
      var pe = Math.min(ei, (p.amtEmp || []).length - 1);
      if (v === 'B') {
        var f = 1 + ((p.amtNat[ni] || 0) + (p.amtEmp[pe] || 0)) / 100;
        mapTiers(s, function (a, t) {
          if (!a) return [0, 0];
          var nt = t > c.consumerTenor ? Math.min(c.housingTenor, t + (p.tenorExt[ni] || 0)) : t;
          return [Math.min(c.total, r500(a * f)), nt];
        });
        s.card = s.card ? Math.min(c.card, r500(s.card * f)) : 0;
        s.minSalary = r50(s.minSalary * (1 - (p.salaryCut[ni] || 0) / 100));
        s.minService = Math.round(s.minService * (1 - (p.serviceCut[ni] || 0) / 100));
        s.regularity = Math.max(1, s.regularity - (p.regCut[ni] || 0));
        s.guarantee = Math.max(0, s.guarantee - (p.guarCut[ni] || 0));
      } else if (v === 'C') {
        var g = Math.max(0, 1 - ((p.amtNat[ni] || 0) + (p.amtEmp[pe] || 0)) / 100);
        mapTiers(s, function (a, t) {
          if (!a) return [0, 0];
          return [f500(a * g), Math.min(t, p.tenorCap[ni] || c.housingTenor)];
        });
        s.card = f500(s.card * g);
        s.minSalary = r50(s.minSalary * (1 + (p.salaryAdd[ni] || 0) / 100));
        s.minService = s.minService + (p.serviceAdd[ni] || 0);
        s.regularity = Math.min(12, s.regularity + (p.regAdd[ni] || 0));
        s.maxAge = Math.min(s.maxAge, p.ageCap[ni] || 99);
        s.dbr = Math.min(s.dbr, p.dbrCap[ni] || 40);
        s.guarantee = Math.min(4, s.guarantee + (p.guarAdd[ni] || 0));
        if (p.suspendLastEmp[ni] && ei === st.emps.length - 1) {
          s.allowed = false;
          mapTiers(s, function () { return [0, 0]; });
          s.card = 0;
        }
      }
    });
  });
  return out;
}

var EXF = {
  amount: 'حد التمويل', tenor: 'مدة الائتمان', minSalary: 'الحد الأدنى للراتب', minService: 'الحد الأدنى لمدة الخدمة (يوم)',
  regularity: 'أشهر انتظام الراتب', maxAge: 'السن القصوى', dbr: 'نسبة الاستقطاع', guarantee: 'الضمان المطلوب',
  card: 'حد البطاقة', allowed: 'السماح بالتمويل', bank: 'بنك الراتب', note: 'ضابط إضافي (نص)'
};
var EXOP = { set: 'تعيين قيمة', pct: 'تعديل بنسبة %', add: 'إضافة / طرح' };

function applyOp(v, op, val) {
  val = Number(val);
  if (op === 'set') return val;
  if (op === 'pct') return v * (1 + val / 100);
  if (op === 'add') return v + val;
  return v;
}

function applyExceptions(st, segs) {
  var c = st.caps;
  (st.exceptions || []).forEach(function (x) {
    if (!x.active) return;
    Object.keys(segs).forEach(function (k) {
      var pr = k.split('|');
      if (x.nat !== '*' && x.nat !== pr[0]) return;
      if (x.emp !== '*' && x.emp !== pr[1]) return;
      var s = segs[k];
      if (x.field === 'note') { s.notes = (s.notes ? s.notes + ' ' : '') + x.value; s.exNote = true; return; }
      if (x.field === 'amount' || x.field === 'tenor') {
        mapTiers(s, function (a, t, ti, b) {
          if ((x.band && x.band !== '*' && x.band !== b) || (x.tier !== undefined && x.tier !== '*' && Number(x.tier) !== ti)) return [a, t];
          if (x.field === 'amount') return [Math.max(0, Math.min(c.total, r500(applyOp(a, x.op, x.value)))), t];
          return [a, Math.max(0, Math.min(c.housingTenor, Math.round(applyOp(t, x.op, x.value))))];
        });
        return;
      }
      if (x.field === 'allowed') { s.allowed = Number(x.value) === 1; return; }
      var v = applyOp(Number(s[x.field]), x.op, x.value);
      if (x.field === 'minSalary') v = r50(v);
      else if (x.field === 'card') v = Math.min(c.card, r500(v));
      else if (x.field === 'dbr') v = Math.min(c.dbr, Math.round(v));
      else if (x.field === 'guarantee') v = Math.max(0, Math.min(4, Math.round(v)));
      else if (x.field === 'bank') v = Math.max(1, Math.min(2, Math.round(v)));
      else v = Math.round(v);
      s[x.field] = Math.max(0, v);
    });
  });
  return segs;
}

function finalSegments(st, v) { return applyExceptions(st, buildVersion(st, v || st.active)); }

function fmtN(x) { return Number(x).toLocaleString('en-US'); }
function fmtAmt(st, a) { if (!a) return '—'; return a >= st.caps.total ? fmtN(a) + ' (الحد الأقصى)' : fmtN(a); }
function fmtField(st, f, v) {
  if (f === 'allowed') return v ? 'مسموح' : 'غير مسموح';
  if (f === 'bank') return BANK[v] || v;
  if (f === 'guarantee') return GUAR[v] || v;
  if (f === 'dbr') return v + '%';
  if (f === 'minService') return v ? v + ' يوم' : 'من أول يوم';
  if (f === 'regularity') return v + (v > 2 ? ' أشهر' : ' شهر');
  if (f === 'maxAge') return v + ' عاماً';
  if (f === 'minSalary' || f === 'card') return fmtN(v) + ' د.ك';
  return v;
}

function validate(st, segs) {
  var out = [], c = st.caps, N = st.nats, E = st.emps;
  function push(level, type, msg, keys) { out.push({ level: level, type: type, msg: msg, keys: keys, id: type + ':' + msg }); }
  // سقوف بنك الكويت المركزي والتدرج الداخلي
  N.forEach(function (n) {
    E.forEach(function (e) {
      var k = K(n.id, e.id), s = segs[k], nm = n.name + ' / ' + e.name;
      if (!s || !s.allowed) return;
      ['b1', 'b2'].forEach(function (b) {
        var bl = b === 'b1' ? 'رواتب أقل من ' + fmtN(st.threshold) : 'رواتب ' + fmtN(st.threshold) + ' فأكثر';
        s.tiers[b].forEach(function (x, ti) {
          if (x[0] > c.total) push('err', 'cap', nm + ': حد التمويل ' + fmtN(x[0]) + ' يتجاوز سقف البنك المركزي ' + fmtN(c.total) + ' (' + bl + ')', [k]);
          if (x[1] > c.housingTenor) push('err', 'cap', nm + ': مدة ' + x[1] + ' شهراً تتجاوز السقف ' + c.housingTenor + ' (' + bl + ')', [k]);
          if (ti > 0) {
            var pv = s.tiers[b][ti - 1];
            if (x[0] < pv[0]) push('warn', 'tier', nm + ': حد شريحة الخدمة «' + TIERN[ti] + '» أقل من الشريحة الأقدم خدمةً الأقل (' + bl + ')', [k]);
            if (x[1] < pv[1]) push('warn', 'tier', nm + ': مدة شريحة الخدمة «' + TIERN[ti] + '» أقل من الشريحة الأقل خدمةً (' + bl + ')', [k]);
          }
          if (b === 'b2' && x[0] < s.tiers.b1[ti][0]) push('warn', 'tier', nm + ': حد الرواتب المرتفعة أقل من حد الرواتب الأدنى (' + TIERN[ti] + ')', [k]);
        });
      });
      if (s.dbr > c.dbr) push('err', 'cap', nm + ': نسبة الاستقطاع ' + s.dbr + '% تتجاوز ' + c.dbr + '%', [k]);
      if (s.card > c.card) push('err', 'cap', nm + ': حد البطاقة يتجاوز ' + fmtN(c.card), [k]);
    });
  });
  function cmp(hi, lo, hiName, loName, dimLabel) {
    var a = segs[hi], b = segs[lo];
    if (!a || !b) return;
    if (!a.allowed && b.allowed) { push('err', 'rank', dimLabel + ': ' + loName + ' مسموح له بالتمويل بينما ' + hiName + ' (الأعلى تصنيفاً) غير مسموح', [hi, lo]); return; }
    if (!a.allowed || !b.allowed) return;
    Object.keys(FIELDS).forEach(function (f) {
      if (f === 'allowed') return;
      var d = FIELDS[f].d, va = Number(a[f]), vb = Number(b[f]);
      if ((d > 0 && vb > va) || (d < 0 && vb < va))
        push('err', 'rank', dimLabel + ': ' + loName + ' يحصل على ' + FIELDS[f].l + ' أفضل من ' + hiName + ' (' + fmtField(st, f, vb) + ' مقابل ' + fmtField(st, f, va) + ')', [hi, lo]);
    });
    ['b1', 'b2'].forEach(function (bd) {
      for (var ti = 0; ti < 3; ti++) {
        var x = a.tiers[bd][ti], y = b.tiers[bd][ti];
        var lbl = ' [' + TIERN[ti] + (bd === 'b2' ? '، رواتب مرتفعة' : '') + ']';
        if (y[0] > x[0]) push('err', 'rank', dimLabel + ': ' + loName + ' يحصل على حد تمويل أعلى من ' + hiName + ' (' + fmtN(y[0]) + ' مقابل ' + fmtN(x[0]) + ')' + lbl, [hi, lo]);
        if (y[1] > x[1]) push('err', 'rank', dimLabel + ': ' + loName + ' يحصل على مدة أطول من ' + hiName + ' (' + y[1] + ' مقابل ' + x[1] + ' شهراً)' + lbl, [hi, lo]);
      }
    });
  }
  E.forEach(function (e) {
    for (var i = 0; i < N.length - 1; i++)
      cmp(K(N[i].id, e.id), K(N[i + 1].id, e.id), N[i].name, N[i + 1].name, 'ترتيب الجنسية – ' + e.name);
  });
  N.forEach(function (n) {
    for (var i = 0; i < E.length - 1; i++)
      cmp(K(n.id, E[i].id), K(n.id, E[i + 1].id), E[i].name, E[i + 1].name, 'ترتيب جهة العمل – ' + n.name);
  });
  return out;
}

function validateMarked(st, v) {
  var noEx = validate(st, buildVersion(st, v));
  var withEx = validate(st, finalSegments(st, v));
  var seen = {};
  noEx.forEach(function (i) { seen[i.id] = 1; });
  withEx.forEach(function (i) { i.fromEx = !seen[i.id]; });
  return withEx;
}

// إعادة الترتيب: dim = 'nats' | 'emps'
function moveRank(st, dim, from, to) {
  if (to < 0 || to >= st[dim].length || from === to) return;
  var oldIds = st[dim].map(function (x) { return x.id; });
  var item = st[dim].splice(from, 1)[0];
  st[dim].splice(to, 0, item);
  if (st.rankMode !== 'ladder') return;
  var newIds = st[dim].map(function (x) { return x.id; });
  var other = (dim === 'nats' ? st.emps : st.nats).map(function (x) { return x.id; });
  ['base', 'custom'].forEach(function (which) {
    var src = st[which];
    if (!src) return;
    var dst = {};
    newIds.forEach(function (nid, p) {
      var oid = oldIds[p];
      other.forEach(function (o) {
        var kNew = dim === 'nats' ? K(nid, o) : K(o, nid);
        var kOld = dim === 'nats' ? K(oid, o) : K(o, oid);
        dst[kNew] = clone(src[kOld]);
        dst[kNew].notes = src[kNew] ? src[kNew].notes : '';
      });
    });
    st[which] = dst;
  });
}

if (typeof module !== 'undefined') module.exports = { buildVersion: buildVersion, finalSegments: finalSegments, validate: validate, validateMarked: validateMarked, moveRank: moveRank, clone: clone, K: K };


/* ===== تشفير ===== */
const te = new TextEncoder(), td = new TextDecoder();
function b64(buf){ const b=new Uint8Array(buf); let s=''; for(let i=0;i<b.length;i+=8192) s+=String.fromCharCode.apply(null,b.subarray(i,i+8192)); return btoa(s); }
function ub64(s){ const bin=atob(s); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; }
async function deriveKey(pw, salt, iter){
  const base = await crypto.subtle.importKey('raw', te.encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function sealObj(key, salt, iter, obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, te.encode(JSON.stringify(obj)));
  return {salt:b64(salt), iter, iv:b64(iv), ct:b64(ct)};
}
async function openObj(pw, box){
  const salt = ub64(box.salt), key = await deriveKey(pw, salt, box.iter);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:ub64(box.iv)}, key, ub64(box.ct));
  return {key, salt, iter:box.iter, obj:JSON.parse(td.decode(pt))};
}

  const saved = lsGet();
  if(saved && saved.ct){
    try{ const r=await openObj(pw, saved); KEY=r.key; SALT=r.salt; ITER=r.iter; ST=r.obj; return; }catch(e){}
  }
  const r = await openObj(pw, VAULT);

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ===== المصفوفة ===== */
function cellVal(s, f, b, t){
  if(!s) return null;
  if(f==='amount') return s.allowed? s.tiers[b][t][0] : null;
  if(f==='tenor') return s.allowed? s.tiers[b][t][1] : null;
  return s.allowed? s[f] : null;
}

    let what=EXF[x.field];
    if(x.field==='amount'||x.field==='tenor') what+=(x.tier!=='*'?' – '+TIERN[x.tier]:'')+(x.band!=='*'?(x.band==='b1'?' – رواتب أقل من '+fmtN(ST.threshold):' – رواتب '+fmtN(ST.threshold)+' فأكثر'):'');
    let val = x.field==='note'? '«'+x.value+'»' : x.field==='guarantee'&&x.op==='set'? GUAR[x.value] : x.field==='allowed'? (Number(x.value)?'مسموح':'غير مسموح') : x.field==='bank'&&x.op==='set'? BANK[x.value] : (x.op==='pct'?(x.value>0?'+':'')+x.value+'%':x.op==='add'?(x.value>0?'+':'')+x.value:'= '+x.value);
    return `<b>${esc(who)}</b><br>${esc(what)}: ${esc(val)}${x.reason?`<br><span class="muted small">${esc(x.reason)}</span>`:''}`;
  };
  m.innerHTML=`<h2>الاستثناءات الخاصة</h2>
  <div class="card"><p class="small muted" style="margin-top:0">ضع ضوابط أو حدوداً خاصة لجنسية أو جهة عمل محددة. يُطبق الاستثناء فوق أي نسخة معتمدة (أ، ب، ج، المخصصة) ولا يتجاوز سقوف بنك الكويت المركزي.</p>
  <div class="grid g3">
    <label class="f"><span>الجنسية</span><select id="xNat"><option value="*">كل الجنسيات</option>${ST.nats.map(n=>`<option value="${n.id}">${esc(n.name)}</option>`).join('')}</select></label>
    <label class="f"><span>جهة العمل</span><select id="xEmp"><option value="*">كل جهات العمل</option>${ST.emps.map(n=>`<option value="${n.id}">${esc(n.name)}</option>`).join('')}</select></label>
    <label class="f"><span>البند</span><select id="xF">${Object.keys(EXF).map(k=>`<option value="${k}">${EXF[k]}</option>`).join('')}</select></label>
    <label class="f" id="xBandL"><span>شريحة الراتب</span><select id="xBand"><option value="*">الكل</option><option value="b1">أقل من ${fmtN(ST.threshold)}</option><option value="b2">${fmtN(ST.threshold)} فأكثر</option></select></label>
    <label class="f" id="xTierL"><span>مدة الخدمة</span><select id="xTier"><option value="*">الكل</option>${TIERN.map((t,i)=>`<option value="${i}">${t}</option>`).join('')}</select></label>
    <label class="f" id="xOpL"><span>العملية</span><select id="xOp">${Object.keys(EXOP).map(k=>`<option value="${k}">${EXOP[k]}</option>`).join('')}</select></label>
    <label class="f"><span>القيمة</span><span id="xValW"></span></label>
    <label class="f"><span>السبب / المرجع</span><input type="text" id="xWhy" placeholder="مثال: قرار لجنة الائتمان رقم …"></label>
  </div>
  <div class="row" style="margin-top:12px"><button class="btn pri" id="xAdd">إضافة الاستثناء</button></div></div>
  <div class="card"><h3>الاستثناءات الحالية</h3>${ST.exceptions.length?`<ul class="exl">${ST.exceptions.map((x,i)=>`<li class="${x.active?'':'off'}"><div class="d">${desc(x)}</div>
    <button class="btn sm" data-xt="${i}">${x.active?'إيقاف':'تفعيل'}</button><button class="btn sm danger" data-xd="${i}">حذف</button></li>`).join('')}</ul>`:'<p class="muted">لا توجد استثناءات.</p>'}</div>`;
  const upd=()=>{
    const f=$('#xF',m).value, tiered=f==='amount'||f==='tenor';
    $('#xBandL',m).classList.toggle('hidden',!tiered); $('#xTierL',m).classList.toggle('hidden',!tiered);
    const noOp = ['guarantee','allowed','bank','note'].includes(f);
    $('#xOpL',m).classList.toggle('hidden',noOp); if(noOp) $('#xOp',m).value='set';
    let w;
    if(f==='guarantee') w=`<select id="xVal">${GUAR.map((g,i)=>`<option value="${i}">${g}</option>`).join('')}</select>`;
    else if(f==='allowed') w=`<select id="xVal"><option value="1">مسموح</option><option value="0">غير مسموح</option></select>`;
    else if(f==='bank') w=`<select id="xVal"><option value="2">${BANK[2]}</option><option value="1">${BANK[1]}</option></select>`;
    else if(f==='note') w=`<input type="text" id="xVal" placeholder="نص الضابط">`;
    else w=`<input type="number" id="xVal" placeholder="${f==='amount'?'مثال: 20000 أو 10 للنسبة':'قيمة'}">`;
    $('#xValW',m).innerHTML=w;
  };
  $('#xF',m).onchange=upd; upd();
  $('#xAdd',m).onclick=()=>{
    const f=$('#xF',m).value, v=$('#xVal',m).value.trim();
    if(v===''){ toast('أدخل القيمة'); return; }
    ST.exceptions.push({id:Date.now(), active:true, nat:$('#xNat',m).value, emp:$('#xEmp',m).value, field:f, op:$('#xOp',m).value, value: f==='note'? v : Number(v), band:$('#xBand',m).value, tier:$('#xTier',m).value, reason:$('#xWhy',m).value.trim()});
    persist(); render(); toast('تمت إضافة الاستثناء');
  };
  $$('[data-xt]',m).forEach(b=>b.onclick=()=>{ const x=ST.exceptions[b.dataset.xt]; x.active=!x.active; persist(); render(); });
  $$('[data-xd]',m).forEach(b=>b.onclick=()=>{ ST.exceptions.splice(Number(b.dataset.xd),1); persist(); render(); });
}

/* ===== الإعدادات ===== */
function rSettings(m){
  const P=ST.params;
  const ptab=(v, rowsN, rowsE)=>`<div class="tw"><table class="t params"><thead><tr><th>مرتبة الجنسية</th>${rowsN.map(r=>`<th>${r[1]}</th>`).join('')}</tr></thead><tbody>
    ${ST.nats.map((n,i)=>`<tr><th>${i+1}. ${esc(n.name)}</th>${rowsN.map(r=> r[0]==='suspendLastEmp'
      ? `<td><input type="checkbox" data-p="${v}.${r[0]}.${i}" ${P[v][r[0]][i]?'checked':''}></td>`
      : `<td><input type="number" data-p="${v}.${r[0]}.${i}" value="${P[v][r[0]][i]}"></td>`).join('')}</tr>`).join('')}</tbody></table></div>
    <div class="tw" style="margin-top:10px"><table class="t params"><thead><tr><th>مرتبة جهة العمل</th><th>${rowsE}</th></tr></thead><tbody>
    ${ST.emps.map((e,i)=>`<tr><th>${i+1}. ${esc(e.name)}</th><td><input type="number" data-p="${v}.amtEmp.${i}" value="${P[v].amtEmp[i]!=null?P[v].amtEmp[i]:0}"></td></tr>`).join('')}</tbody></table></div>`;
  m.innerHTML=`<h2>الإعدادات</h2>
  <div class="card"><h3>نسب النسخة (ب) المخففة</h3>
  <p class="small muted" style="margin-top:0">نسبة رفع الحد = نسبة الجنسية + نسبة جهة العمل. الشرائح الأعلى تأخذ نسبة أكبر حتى يبقى الترتيب سليماً. تمديد المدة يطبق على شرائح التمويل الإسكاني فقط (أكثر من ${ST.caps.consumerTenor} شهراً).</p>
  ${ptab('B',[['amtNat','رفع الحد %'],['tenorExt','تمديد المدة (شهر)'],['salaryCut','خفض الحد الأدنى للراتب %'],['serviceCut','خفض مدة الخدمة %'],['regCut','خفض أشهر الانتظام'],['guarCut','تخفيف الضمان (درجات)']],'تعديل إضافي للحد %')}</div>
  <div class="card"><h3>نسب النسخة (ج) المشددة</h3>
  <p class="small muted" style="margin-top:0">نسبة خفض الحد = نسبة الجنسية + نسبة جهة العمل. الشرائح الأدنى تتحمل الخفض الأكبر.</p>
  ${ptab('C',[['amtNat','خفض الحد %'],['tenorCap','سقف المدة (شهر)'],['salaryAdd','رفع الحد الأدنى للراتب %'],['serviceAdd','زيادة مدة الخدمة (يوم)'],['regAdd','زيادة أشهر الانتظام'],['ageCap','سقف السن'],['dbrCap','سقف الاستقطاع %'],['guarAdd','تشديد الضمان (درجات)'],['suspendLastEmp','إيقاف آخر جهة عمل']],'خفض إضافي للحد %')}</div>
  <div class="card"><h3>سقوف بنك الكويت المركزي والبيانات العامة</h3><div class="grid g3">
    ${[['caps.consumer','سقف التمويل الاستهلاكي'],['caps.total','سقف التمويل الإجمالي (الإسكاني)'],['caps.consumerTenor','مدة الاستهلاكي (شهر)'],['caps.housingTenor','مدة الإسكاني (شهر)'],['caps.dbr','سقف نسبة الاستقطاع %'],['caps.card','سقف البطاقة'],['threshold','حد شريحة الرواتب المرتفعة']].map(([p,l])=>`<label class="f"><span>${l}</span><input type="number" data-g="${p}" value="${p.split('.').reduce((o,k)=>o[k],ST)}"></label>`).join('')}
    ${[['meta.title','عنوان الدليل'],['meta.org','الجهة المُعِدّة'],['meta.edition','تاريخ الإصدار']].map(([p,l])=>`<label class="f"><span>${l}</span><input type="text" data-g="${p}" value="${esc(p.split('.').reduce((o,k)=>o[k],ST))}"></label>`).join('')}
  </div></div>
  <div class="card"><h3>كلمة المرور ومشاركة البرنامج</h3>
    <div class="grid g3"><label class="f"><span>كلمة مرور جديدة</span><input type="password" id="np1"></label><label class="f"><span>تأكيد كلمة المرور</span><input type="password" id="np2"></label></div>
    <div class="row" style="margin-top:10px"><button class="btn" id="chPw">تغيير كلمة المرور</button><button class="btn pri" id="dlApp">تنزيل البرنامج بالإعدادات الحالية</button></div>
    <p class="note" style="margin:10px 0 0">«تنزيل البرنامج» ينتج ملف HTML واحداً مشفراً يحتوي كل تعديلاتك ويُفتح بكلمة المرور الحالية. هذا هو الملف الذي ترسله لفريقك أو ترفعه صفحة ويب. أرسل كلمة المرور لهم بشكل منفصل.</p>
  </div>
  <div class="card"><h3>النسخ الاحتياطي</h3>
    <div class="row"><button class="btn" id="expJ">تصدير الإعدادات (JSON)</button><label class="btn" style="display:inline-block">استيراد إعدادات<input type="file" id="impJ" accept=".json,application/json" class="hidden"></label><button class="btn danger" id="rst">استعادة الإعدادات الأصلية</button></div>
    <p class="small muted">ملف JSON غير مشفر، فاحفظه في مكان آمن.</p>
  </div>`;
  $$('[data-p]',m).forEach(inp=>inp.onchange=()=>{ const [v,f,i]=inp.dataset.p.split('.'); ST.params[v][f][Number(i)] = inp.type==='checkbox'? inp.checked : Number(inp.value); persist(); render(); });
  $$('[data-g]',m).forEach(inp=>inp.onchange=()=>{ const ps=inp.dataset.g.split('.'); let o=ST; for(let i=0;i<ps.length-1;i++) o=o[ps[i]]; o[ps[ps.length-1]] = inp.type==='number'? Number(inp.value) : inp.value; persist(); render(); });
  $('#chPw',m).onclick=async()=>{
    const a=$('#np1',m).value, b=$('#np2',m).value;
    if(a.length<6){ toast('كلمة المرور 6 أحرف على الأقل'); return; }
    if(a!==b){ toast('كلمتا المرور غير متطابقتين'); return; }
    SALT=crypto.getRandomValues(new Uint8Array(16)); KEY=await deriveKey(a,SALT,ITER); persist();
    toast('تم التغيير. نزّل البرنامج الآن ليعمل الملف بكلمة المرور الجديدة.');
  };
  $('#dlApp',m).onclick=async()=>{
    const box=await sealObj(KEY,SALT,ITER,ST);
    const M1='/*VA'+'ULT*/', M2='/*END'+'VAULT*/';
    const a=SRC.indexOf(M1), b=SRC.indexOf(M2);
    const html=SRC.slice(0,a+M1.length)+JSON.stringify(box)+SRC.slice(b);
    download('credit-guide-program.html', html, 'text/html');
  };
  $('#expJ',m).onclick=()=>download('credit-guide-settings.json', JSON.stringify(ST,null,1), 'application/json');
  $('#impJ',m).onchange=e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ const o=JSON.parse(r.result); if(!o.base||!o.nats||!o.emps) throw 0; ST=o; persist(); UI.nat=ST.nats[0].id; UI.emp=ST.emps[0].id; render(); toast('تم الاستيراد'); }catch(err){ toast('ملف غير صالح'); } }; r.readAsText(f); };
  $('#rst',m).onclick=async()=>{ if(!confirm('استعادة الإعدادات الأصلية المضمنة في الملف؟ ستفقد تعديلاتك غير المصدّرة.')) return; const pw=prompt('أدخل كلمة مرور الملف الأصلية'); if(pw==null) return; try{ const r=await openObj(pw,VAULT); ST=r.obj; persist(); UI.nat=ST.nats[0].id; UI.emp=ST.emps[0].id; render(); toast('تمت الاستعادة'); }catch(e){ toast('كلمة المرور غير صحيحة'); } };
}

      ${ST.emps.map((e,ei)=>{ const s=segs[K(n.id,e.id)]; if(!s.allowed) return `<tr><td class="l"><span class="rk">${ei+1}</span>${esc(e.name)}</td><td colspan="6" class="na">غير مسموح</td></tr>`;
        return `<tr><td class="l"><span class="rk">${ei+1}</span>${esc(e.name)}</td>${['b1','b2'].map(b=>s.tiers[b].map(x=>`<td>${x[0]?fmtAmt(ST,x[0])+'<br>'+x[1]+' شهراً':'—'}</td>`).join('')).join('')}</tr>`; }).join('')}</table>
      <div style="font-size:10.5px;color:#555">تبدأ شريحة «${TIERN[0]}» من الحد الأدنى لمدة الخدمة الموضح أعلاه. المبالغ التي تتجاوز ${fmtN(c.consumer)} د.ك تمثل الحد الإجمالي شاملاً التمويل الإسكاني.</div>
      ${(()=>{ const notes=ST.emps.map(e=>{ const s=segs[K(n.id,e.id)]; return s.allowed&&s.notes? `<li><b>${esc(e.name)}:</b> ${esc(s.notes)}</li>`:''; }).join(''); return notes?`<h3>ضوابط خاصة حسب جهة العمل</h3><ul>${notes}</ul>`:''; })()}
      ${(ST.texts.natConditions[n.id]||[]).length?`<h3>الشروط والضوابط الخاصة بالشريحة</h3>${ul(ST.texts.natConditions[n.id])}`:''}
    </div>`;
  });
  const exs=ST.exceptions.filter(x=>x.active);
  h+=`<div class="pg">${head('الاستثناءات وتواريخ الاستحقاق والتحقق')}
    <h3>الاستثناءات الخاصة المطبقة</h3>
    ${exs.length?`<table><tr><th>الجنسية</th><th>جهة العمل</th><th>البند</th><th>التعديل</th><th>السبب / المرجع</th></tr>${exs.map(x=>`<tr><td>${x.nat==='*'?'الكل':esc(natName(ST,x.nat))}</td><td>${x.emp==='*'?'الكل':esc(empName(ST,x.emp))}</td><td>${EXF[x.field]}${(x.field==='amount'||x.field==='tenor')&&x.tier!=='*'?' – '+TIERN[x.tier]:''}</td><td>${x.field==='note'?esc(x.value):x.field==='guarantee'?GUAR[x.value]:x.field==='allowed'?(Number(x.value)?'مسموح':'غير مسموح'):x.field==='bank'?BANK[x.value]:x.op==='pct'?x.value+'%':x.op==='add'?(x.value>0?'+':'')+x.value:'= '+x.value}</td><td>${esc(x.reason||'')}</td></tr>`).join('')}</table>`:'<p>لا توجد استثناءات مطبقة.</p>'}
    <h3>تواريخ استحقاق الأقساط</h3><table><tr><th>الفئة</th><th>تاريخ الاستحقاق</th></tr>${ST.texts.dueDates.map(r=>`<tr><td class="l">${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join('')}</table>
    <h3>نتيجة فحص منطقية الترتيب</h3>
    ${iss.length?`<p class="bad">يوجد ${iss.length} تنبيه:</p><ul>${iss.map(i=>`<li>${esc(i.msg)}${i.fromEx?' (ناتج عن استثناء معتمد)':''}</li>`).join('')}</ul>`:'<p class="ok">تم التحقق آلياً: لا توجد أي شريحة أدنى تصنيفاً تحصل على شروط أفضل من شريحة أعلى، ولا تجاوز لسقوف بنك الكويت المركزي.</p>'}
    <div style="margin-top:30px;display:flex;justify-content:space-around;font-size:12px"><div>إعداد: ${esc(ST.meta.org)}<br><br>التوقيع: ...............</div><div>اعتماد: .........................<br><br>التاريخ: ...............</div></div>
  </div></div>`;
  return h;
}
function guideCSS(){ const css=document.querySelector('style').textContent; return css; }
function doPrint(){
  $('#print').innerHTML=guideHTML();
  try{ window.print(); }catch(e){ doDownloadGuide(); }
}
function doDownloadGuide(){
  const name={A:'A',B:'B',C:'C',D:'custom'}[ST.active];
  const html=`<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(ST.meta.title)} – ${VNAMES[ST.active]}</title><style>${guideCSS()} body{background:#fff} #print{display:block} .bar-print{position:sticky;top:0;background:#0f5c4d;color:#fff;padding:10px;text-align:center;font-family:Tahoma} .bar-print button{font:inherit;padding:6px 16px;border-radius:8px;border:0} @media print{.bar-print{display:none}}</style></head><body><div class="bar-print">اضغط لحفظ الدليل PDF أو طباعته: <button onclick="window.print()">طباعة / PDF</button></div><div id="print">${guideHTML()}</div></body></html>`;
  download('credit-guide-'+name+'.html', html, 'text/html');
}
function rPreview(m){
  m.innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:10px"><h2 style="margin:0">معاينة ${VNAMES[ST.active]}</h2><div class="row"><button class="btn pri" id="pp">طباعة / حفظ PDF</button><button class="btn" id="pd">تنزيل نسخة للطباعة</button></div></div><div class="preview">${guideHTML()}</div>`;
  $('#pp',m).onclick=doPrint; $('#pd',m).onclick=doDownloadGuide;
}
</script>
