<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b3d34">
<title>برنامج «دليل منح الائتمان» الديناميكي</title>
<style>
:root{
  --bg:#f4f3ee; --surface:#ffffff; --surface2:#eeede6; --surface3:#e6e4db; --ink:#1c1f1d; --muted:#666b66; --line:#dbd8cd;
  --brand:#0b3d34; --accent:#0f5c4d; --accent-ink:#fff; --accentSoft:#dcebe6;
  --A:#0f5c4d; --As:#dcebe6; --B:#1d5fa8; --Bs:#dde8f5; --C:#a33b21; --Cs:#f6e1da;
  --ok:#2f7a3b; --okSoft:#e0f0e2; --err:#b3261e; --errSoft:#fbe3e1; --warn:#8a6200; --warnSoft:#fbf0d4; --ice:#2b6f9e; --iceSoft:#e1eef7;
  --r:14px; --font:"Segoe UI",Tahoma,"Noto Naskh Arabic","Noto Sans Arabic","Geeza Pro",Arial,sans-serif;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141513; --surface:#1d1f1c; --surface2:#262824; --surface3:#30322d; --ink:#ebeae4; --muted:#a3a199; --line:#383a34;
  --brand:#0b3d34; --accent:#4fb39d; --accent-ink:#0b1f1a; --accentSoft:#1d3832;
  --A:#5fc2aa; --As:#1d3832; --B:#86b5ec; --Bs:#1d2c3f; --C:#ee957c; --Cs:#3d2520;
  --ok:#7fcf8a; --okSoft:#1c3320; --err:#f2877f; --errSoft:#3d1f1d; --warn:#e6c065; --warnSoft:#3a3019; --ice:#8fc3ea; --iceSoft:#1b2e3d;
  --shadow:none;
}}
:root[data-theme="dark"]{
  --bg:#141513; --surface:#1d1f1c; --surface2:#262824; --surface3:#30322d; --ink:#ebeae4; --muted:#a3a199; --line:#383a34;
  --brand:#0b3d34; --accent:#4fb39d; --accent-ink:#0b1f1a; --accentSoft:#1d3832;
  --A:#5fc2aa; --As:#1d3832; --B:#86b5ec; --Bs:#1d2c3f; --C:#ee957c; --Cs:#3d2520;
  --ok:#7fcf8a; --okSoft:#1c3320; --err:#f2877f; --errSoft:#3d1f1d; --warn:#e6c065; --warnSoft:#3a3019; --ice:#8fc3ea; --iceSoft:#1b2e3d;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
body{overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
a{color:var(--accent)}
/* ---- lock ---- */
#lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(circle at 50% 0%,#145a4c 0,#0b3d34 55%,#072a24 100%)}
.lockbox{background:var(--surface);border-radius:22px;padding:30px 22px 22px;width:100%;max-width:390px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.lockbox h1{font-size:22px;margin:10px 0 4px}
.lockbox p{color:var(--muted);margin:0 0 18px;font-size:14px}
.seal{width:62px;height:62px;border-radius:18px;background:var(--accentSoft);color:var(--accent);display:inline-flex;align-items:center;justify-content:center}
.pwrap{position:relative}
.pwrap input{padding-inline-start:46px!important}
.eye{position:absolute;inset-inline-start:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;width:36px;height:36px;border-radius:9px;color:var(--muted);display:flex;align-items:center;justify-content:center}
.eye:hover{background:var(--surface2)}
.copy{color:var(--muted);font-size:12.5px;text-align:center}
/* ---- shell ---- */
header.top{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.bar{display:flex;align-items:center;gap:8px;padding:10px 16px;max-width:1240px;margin:0 auto}
.bar .ttl{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.bar .ttl b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .ttl span{font-size:12px;opacity:.75}
.hbtn{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;border-radius:10px;padding:6px 10px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.hbtn:disabled{opacity:.4}
.vchip{border:0;border-radius:999px;padding:5px 12px 5px 6px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.vchip i{font-style:normal;width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:13px}
.vA{background:#dcebe6;color:#0f5c4d} .vA i{background:#0f5c4d}
.vB{background:#dde8f5;color:#1d5fa8} .vB i{background:#1d5fa8}
.vC{background:#f6e1da;color:#a33b21} .vC i{background:#a33b21}
nav.tabs{display:flex;gap:2px;overflow-x:auto;padding:0 10px 8px;max-width:1240px;margin:0 auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:transparent;padding:7px 12px;border-radius:10px;white-space:nowrap;color:rgba(255,255,255,.72);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
nav.tabs button.on{background:#fff;color:var(--brand)}
nav.tabs .cnt{background:#e8574a;color:#fff;border-radius:99px;font-size:11px;padding:0 6px;line-height:17px}
main{max-width:1240px;margin:0 auto;padding:16px 16px 40px}
footer.copyf{text-align:center;color:var(--muted);font-size:12.5px;padding:6px 16px 28px}
h2{font-size:20px;margin:4px 0 12px}
h3{font-size:16px;margin:0 0 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--surface2);padding:8px 14px;border-radius:10px;font-weight:600;display:inline-flex;align-items:center;gap:6px;justify-content:center;white-space:nowrap}
.btn:hover{background:var(--surface3)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.danger{color:var(--err)}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:8px}
.btn.xs{padding:2px 8px;font-size:12px;border-radius:7px}
.btn.ghost{background:transparent;border-color:transparent}
.btn:disabled{opacity:.45;cursor:default}
.ico{width:18px;height:18px;flex:none}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
label.f > span{font-weight:600}
select,input[type=text],input[type=number],input[type=password],input[type=date],input[type=search],textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;color:var(--ink);min-width:0;outline:none}
select:focus,input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentSoft)}
textarea{min-height:120px;resize:vertical;line-height:1.7}
.seg{display:inline-flex;background:var(--surface2);border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-weight:600;color:var(--muted);font-size:14px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:700;white-space:nowrap;background:var(--surface2);color:var(--muted)}
.p-ok{background:var(--okSoft);color:var(--ok)} .p-err{background:var(--errSoft);color:var(--err)} .p-warn{background:var(--warnSoft);color:var(--warn)}
.p-ice{background:var(--iceSoft);color:var(--ice)} .p-mute{background:var(--surface2);color:var(--muted)}
.p-A{background:var(--As);color:var(--A)} .p-B{background:var(--Bs);color:var(--B)} .p-C{background:var(--Cs);color:var(--C)}
.muted{color:var(--muted)} .small{font-size:13px} .xsmall{font-size:12px}
.note{background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:13.5px;color:var(--muted)}
.empty{padding:30px 10px;text-align:center;color:var(--muted)}
/* version cards */
.vcards{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.vcard{position:relative;border-radius:18px;padding:18px;background:var(--surface);border:2px solid var(--line);display:flex;flex-direction:column;gap:10px;overflow:hidden;box-shadow:var(--shadow)}
.vcard.on{border-color:currentColor}
.vcard .big{width:54px;height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;color:#fff;flex:none}
.vcard h3{margin:0;font-size:18px}
.vcard .meta{font-size:12.5px;color:var(--muted)}
.vcard p{margin:0;color:var(--muted);font-size:13.5px;flex:1}
.vcard.cA{color:var(--A)} .vcard.cB{color:var(--B)} .vcard.cC{color:var(--C)}
.vcard.cA .big{background:#0f5c4d} .vcard.cB .big{background:#1d5fa8} .vcard.cC .big{background:#a33b21}
.vcard .ink{color:var(--ink)}
.ribbon{position:absolute;top:14px;inset-inline-end:-34px;transform:rotate(-45deg);background:currentColor;padding:2px 40px;font-size:11.5px;font-weight:800}
.ribbon span{color:#fff}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-size:24px;line-height:1.2}
/* rules */
.toolbar{position:sticky;top:96px;z-index:5;background:var(--bg);padding:8px 0 10px;margin-bottom:6px}
.rgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
.rc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.rc.frozen{background:repeating-linear-gradient(135deg,var(--surface),var(--surface) 10px,var(--iceSoft) 10px,var(--iceSoft) 20px)}
.rc.cancelled{opacity:.55}
.rc.bad{border-color:var(--err);box-shadow:0 0 0 1px var(--err) inset}
.rc .hd{display:flex;align-items:flex-start;gap:8px}
.rc .hd b{font-size:14.5px;line-height:1.4}
.rid{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:var(--surface2);border-radius:6px;padding:1px 6px;color:var(--muted);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{background:var(--surface2);border-radius:7px;padding:1px 8px;font-size:12px;color:var(--muted)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.kv div{background:var(--surface2);border-radius:10px;padding:6px 9px;min-width:0}
.kv small{display:block;font-size:11.5px;color:var(--muted)}
.kv strong{font-size:14px;display:block;overflow-wrap:anywhere}
.kv .hl{background:var(--accentSoft)}
.was{font-size:11.5px;color:var(--muted);text-decoration:line-through}
.rc ul{margin:0;padding-inline-start:18px;font-size:12.5px;color:var(--muted)}
.rc .ft{display:flex;gap:6px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:8px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:7px 9px;text-align:right;vertical-align:top}
table.t thead th{background:var(--surface2);font-weight:700;position:sticky;top:0;white-space:nowrap}
table.t tr.frozen td{background:var(--iceSoft)}
table.t tr.cancelled td{opacity:.5}
table.t tr.bad td:first-child{box-shadow:inset -4px 0 var(--err)}
table.t td.nw{white-space:nowrap}
/* modal / sheet */
.ov{position:fixed;inset:0;background:rgba(10,14,12,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:0}
.sheet{background:var(--bg);width:100%;max-width:880px;max-height:94vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden;animation:up .18s ease-out}
@media (min-width:760px){ .ov{align-items:center;padding:20px} .sheet{border-radius:20px;max-height:90vh} }
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.sheet .sh{display:flex;align-items:center;gap:8px;padding:14px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.sheet .sh b{flex:1;font-size:16.5px}
.sheet .sb{padding:16px;overflow:auto;flex:1}
.sheet .sf{display:flex;gap:8px;padding:12px 16px;background:var(--surface);border-top:1px solid var(--line);flex-wrap:wrap}
.fgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.other{margin-top:6px}
.mchips{display:flex;flex-direction:column;gap:6px}
.mchip{display:flex;gap:8px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:13.5px;color:var(--ink)}
.mchip span{flex:1}
.mchip button{border:0;background:transparent;color:var(--err);font-size:16px;line-height:1;padding:2px 4px}
.fs{border:1px solid var(--line);border-radius:14px;padding:12px;margin:0 0 12px;background:var(--surface)}
.fs > b{display:block;margin-bottom:10px;font-size:14px}
/* lists */
.ranklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ranklist li{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 8px}
.ranklist li.fz{background:var(--iceSoft)}
.ranklist .n{width:28px;height:28px;border-radius:8px;background:var(--brand);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:800;flex:none;font-size:13px}
.ranklist .v{flex:1;min-width:0;font-size:14px;overflow-wrap:anywhere}
.ranklist .u{font-size:11.5px;color:var(--muted);white-space:nowrap}
.ib{border:1px solid var(--line);background:var(--surface2);border-radius:8px;width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;flex:none;padding:0}
.ib:disabled{opacity:.3}
.ib.on{background:var(--iceSoft);color:var(--ice);border-color:var(--ice)}
/* conflicts */
.cl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.cl li{background:var(--errSoft);border-radius:12px;padding:10px 12px;font-size:13.5px;border-inline-start:4px solid var(--err)}
.cl li.warn{background:var(--warnSoft);border-color:var(--warn)}
.cl .ex{font-size:12px;color:var(--muted);margin-top:4px;direction:rtl}
.idl{display:inline-flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.idl button{border:1px solid var(--line);background:var(--surface);border-radius:6px;font-size:12px;padding:0 6px;font-family:ui-monospace,Menlo,Consolas,monospace}
/* nationality page */
.natchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.natchips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:700;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.natchips button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.natchips em{font-style:normal;font-size:11.5px;opacity:.75}
.sec ul{margin:0;padding-inline-start:20px}
.sec li{margin-bottom:3px}
.sec h4{margin:12px 0 6px;font-size:14.5px;color:var(--accent)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1c1f1d;color:#fff;padding:10px 18px;border-radius:12px;z-index:90;font-weight:600;max-width:92vw;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.busy{position:fixed;inset:0;background:rgba(10,14,12,.55);z-index:95;display:flex;align-items:center;justify-content:center;color:#fff;flex-direction:column;gap:12px;font-weight:700}
.spin{width:42px;height:42px;border-radius:50%;border:4px solid rgba(255,255,255,.25);border-top-color:#fff;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.logt td{font-size:12.5px}
.diff{margin:0;padding:0;list-style:none}
.diff li{margin:1px 0}
.diff del{color:var(--err);text-decoration:line-through}
.diff ins{color:var(--ok);text-decoration:none;font-weight:600}
@media (max-width:640px){
  main{padding:12px 12px 40px} .card{padding:13px} .bar{padding:8px 12px}
  .toolbar{top:92px}
  .rgrid{grid-template-columns:1fr}
  .hide-m{display:none!important}
}
/* ===== صفحات الدليل (للطباعة وPDF) ===== */
#stage{position:fixed;left:-20000px;top:0;width:1123px}
#print{display:none}
.gp{width:1123px;height:794px;background:#fff;color:#1a1a1a;font-family:var(--font);position:relative;overflow:hidden;direction:rtl;font-size:11px;line-height:1.55}
.gp .ph{position:absolute;top:22px;right:34px;left:34px;height:30px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #0f5c4d;font-size:10.5px;color:#555}
.gp .ph b{color:#0f5c4d;font-size:11.5px}
.gp .vtag{display:inline-block;color:#fff;border-radius:4px;padding:0 7px;font-weight:700;margin-inline-start:6px}
.gp .pb{position:absolute;top:64px;right:34px;left:34px;bottom:46px;overflow:hidden}
.gp .pf{position:absolute;bottom:16px;right:34px;left:34px;height:22px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid #ccc;font-size:9.5px;color:#777}
.gp h1{font-size:22px;color:#0f5c4d;margin:0 0 10px}
.gp h2{font-size:16px;color:#0f5c4d;margin:10px 0 6px}
.gp h3{font-size:13px;color:#222;margin:8px 0 4px}
.gp ul{margin:0 0 6px;padding-inline-start:20px}
.gp li{margin-bottom:2px}
.gp p{margin:0 0 6px}
.gp table{border-collapse:collapse;width:100%;margin:0 0 8px;font-size:10px;table-layout:auto}
.gp th,.gp td{border:1px solid #a9b3b0;padding:3px 5px;text-align:center;vertical-align:middle}
.gp th{background:#0f5c4d;color:#fff;font-weight:700}
.gp td.l{text-align:right}
.gp td.rep{color:#bbb}
.gp tr.fz td{background:#eaf3f9;color:#557}
.gp .tag{display:inline-block;font-size:9px;border-radius:3px;padding:0 4px;font-weight:700}
.gp .tfz{background:#2b6f9e;color:#fff}
.gp .chg{font-weight:700}
.gp .was{display:block;font-size:8.5px;color:#888;text-decoration:line-through;font-weight:400}
.gp .box{border:1px solid #c9d6d2;border-radius:6px;padding:7px 10px;background:#f4f8f6;margin:0 0 8px}
.gp .cap{font-size:10px;color:#666;margin:-4px 0 6px}
.gp .cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;background:linear-gradient(160deg,#0b3d34,#0f5c4d 60%,#145f50)}
.gp .cover .frame{position:absolute;inset:26px;border:2px solid rgba(255,255,255,.35);border-radius:10px}
.gp .cover h1{font-size:44px;color:#fff;margin:0}
.gp .cover .org{color:#cfe5dd;font-size:16px;letter-spacing:.5px}
.gp .cover .sub{color:#d8ebe5;font-size:14px}
.gp .cover .vbadge{background:#fff;border-radius:14px;padding:10px 34px;font-size:26px;font-weight:800}
.gp .cover .vmeta{color:#fff;font-size:15px}
.gp .cover .vnote{color:#d8ebe5;font-size:12.5px;max-width:720px}
.gp .cover .cp{position:absolute;bottom:48px;left:0;right:0;color:#cfe5dd;font-size:12px}
.gp .divp{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#f1f6f4}
.gp .divp .num{width:70px;height:70px;border-radius:20px;background:#0f5c4d;color:#fff;font-size:34px;font-weight:800;display:flex;align-items:center;justify-content:center}
.gp .divp h1{font-size:36px;margin:0}
.gp .toc td{border:0;border-bottom:1px dotted #bbb;text-align:right;font-size:12.5px;padding:5px 4px}
.gp .toc td.tpn{text-align:left;width:60px;font-weight:700;color:#0f5c4d}
.gp .sig{display:flex;justify-content:space-around;margin-top:30px;font-size:12px}
@media print{
  @page{size:297mm 210mm;margin:0}

function snapshotForUndo(){ const s = clone(ST); s.releases = null; return s; }
function mutate(action, target, fn, details){
  UNDO.push({s:snapshotForUndo(), a:action, t:target}); if (UNDO.length > 30) UNDO.shift();
  const r = fn();
  addLog(action, target, details);
  persist(); render();
  return r;
}
function addLog(action, target, details){
  ST.log.unshift({t:Date.now(), u:ST.meta.user || '—', a:action, g:target || '', d:details || ''});
  if (ST.log.length > 3000) ST.log.length = 3000;
}
function undo(){
  const u = UNDO.pop(); if (!u) return;
  const rel = ST.releases, log = ST.log;
  ST = u.s; ST.releases = rel; ST.log = log;
  addLog('تراجع', u.t, 'تم التراجع عن: ' + u.a);

}
function relog(fieldDiff){ return fieldDiff; }

function defaultsRule(){ const o = {}; FIELDS.forEach(f => { o[f] = MULTI[f] ? [] : ALL; }); Object.assign(o, {salFrom:'', salTo:'فأكثر', svcFrom:0, svcTo:'فأكثر', guar:listVals(ST, 'guar')[0] || '', limit:'الحدود القصوى', tenor:'الحدود القصوى', product:listVals(ST, 'product')[0] || ALL, bank:listVals(ST, 'bank')[0] || ALL}); return o; }

}

function blockToText(b){ return b.kind === 'table' ? [b.cols.join(' | ')].concat(b.rows.map(r => r.join(' | '))).join('\n') : b.items.join('\n'); }
function textToBlock(h, kind, t){
  const lines = t.split('\n').map(x => x.trim()).filter(Boolean);
  if (kind === 'table'){ const rows = lines.map(l => l.split('|').map(c => c.trim())); return {h, kind, cols:rows[0] || [], rows:rows.slice(1)}; }
  return {h, kind, items:lines};
}
function openSection(id, nat){
  const isNew = !id, s = isNew ? {id:'S' + Date.now().toString(36), title:'', nat:nat || '', pos:'before', blocks:[{h:'', kind:'list', items:[]}]} : clone(ST.sections.find(x => x.id === id));
  const blk = (b, i) => `<div class="fs" data-b="${i}"><div class="row" style="margin-bottom:8px"><b style="margin:0;flex:1">فقرة ${i + 1}</b>
      <button type="button" class="ib" data-bu="${i}">${ic('up')}</button><button type="button" class="ib" data-bd="${i}">${ic('down')}</button><button type="button" class="ib" data-bx="${i}" style="color:var(--err)">${ic('trash')}</button></div>
    <div class="fgrid"><label class="f"><span>عنوان الفقرة (اختياري)</span><input type="text" data-bh value="${esc(b.h)}"></label>
    <label class="f"><span>النوع</span><select data-bk><option value="list"${b.kind === 'list' ? ' selected' : ''}>قائمة بنود</option><option value="table"${b.kind === 'table' ? ' selected' : ''}>جدول</option></select></label></div>
    <label class="f" style="margin-top:8px"><span data-hint>${b.kind === 'table' ? 'السطر الأول أسماء الأعمدة، ثم سطر لكل صف، وتفصل الخلايا بعلامة |' : 'كل سطر بند مستقل'}</span><textarea data-bt>${esc(blockToText(b))}</textarea></label></div>`;
  const draw = ov => { $('#blocks', ov).innerHTML = s.blocks.map(blk).join(''); bind(ov); };
  const collect = ov => { s.blocks = $$('[data-b]', ov).map(el => textToBlock($('[data-bh]', el).value.trim(), $('[data-bk]', el).value, $('[data-bt]', el).value)); };
  const bind = ov => {
    $$('[data-bk]', ov).forEach(k => k.onchange = () => { $('[data-hint]', k.closest('[data-b]')).textContent = k.value === 'table' ? 'السطر الأول أسماء الأعمدة، ثم سطر لكل صف، وتفصل الخلايا بعلامة |' : 'كل سطر بند مستقل'; });
    $$('[data-bx]', ov).forEach(b => b.onclick = () => { collect(ov); s.blocks.splice(+b.dataset.bx, 1); draw(ov); });
    $$('[data-bu]', ov).forEach(b => b.onclick = () => { collect(ov); const i = +b.dataset.bu; if (i > 0){ const [x] = s.blocks.splice(i, 1); s.blocks.splice(i - 1, 0, x); } draw(ov); });
    $$('[data-bd]', ov).forEach(b => b.onclick = () => { collect(ov); const i = +b.dataset.bd; if (i < s.blocks.length - 1){ const [x] = s.blocks.splice(i, 1); s.blocks.splice(i + 1, 0, x); } draw(ov); });
  };
  sheet(isNew ? 'قسم جديد' : 'تعديل القسم', `
    <div class="fs"><div class="fgrid">
      <label class="f"><span>اسم القسم</span><input type="text" id="sT" value="${esc(s.title)}" placeholder="مثال: الضوابط العامة"></label>
      <label class="f"><span>يظهر في</span><select id="sN"><option value="">الدليل العام</option>${nats().map(n => `<option value="${esc(n.v)}"${s.nat === n.v ? ' selected' : ''}>صفحات شريحة: ${esc(n.v)}</option>`).join('')}</select></label>
      <label class="f"><span>موضعه (للأقسام العامة)</span><select id="sP"><option value="before"${s.pos !== 'after' ? ' selected' : ''}>قبل صفحات الشرائح</option><option value="after"${s.pos === 'after' ? ' selected' : ''}>بعد صفحات الشرائح</option></select></label>
    </div></div><div id="blocks"></div><button type="button" class="btn" id="bAdd">${ic('plus')}إضافة فقرة</button>`,
    [`<button class="btn pri" data-save>${ic('check')}حفظ القسم</button>`, '<button class="btn" data-close>إلغاء</button>'],
    (ov, close) => {
      draw(ov);
      $('#bAdd', ov).onclick = () => { collect(ov); s.blocks.push({h:'', kind:'list', items:[]}); draw(ov); };
      $('[data-save]', ov).onclick = () => {
        collect(ov); s.title = $('#sT', ov).value.trim(); s.nat = $('#sN', ov).value; s.pos = $('#sP', ov).value;
        if (!s.title){ toast('اكتب اسم القسم'); return; }

        close();

      };
    });
}

/* ===== الدليل المطبوع: الترقيم والطباعة وPDF وExcel ===== */
const VCOL = {A:'#0f5c4d', B:'#1d5fa8', C:'#a33b21'};

function Pager(S, head){
  const stage = $('#stage'); stage.innerHTML = '';
  this.S = S; this.head = head; this.pages = []; this.toc = []; this.stage = stage;
}
Pager.prototype.newPage = function(bare){
  const p = document.createElement('div'); p.className = 'gp';
  if (bare){ this.stage.appendChild(p); this.pages.push(p); this.cur = null; return p; }
  p.innerHTML = `<div class="ph"><span><b>${esc(this.head.title)}</b>${this.head.tag || ''}</span><span>${esc(this.head.right || '')}</span></div><div class="pb"><div class="pbi"></div></div><div class="pf"><span>${esc(COPYRIGHT)} · وثيقة داخلية – This is an internal document</span><span class="pn"></span></div>`;
  this.stage.appendChild(p); this.pages.push(p); this.cur = p.querySelector('.pbi'); this.box = p.querySelector('.pb');
  return p;
};
Pager.prototype.fits = function(){ return this.cur.offsetHeight <= this.box.clientHeight; };
Pager.prototype.room = function(){ return this.cur ? this.box.clientHeight - this.cur.offsetHeight : 0; };
Pager.prototype.ensure = function(){ if (!this.cur) this.newPage(); };
Pager.prototype.html = function(h, minRoom){
  this.ensure();
  if (minRoom && this.room() < minRoom && this.cur.childNodes.length) this.newPage();
  const t = document.createElement('div'); t.innerHTML = h; const nodes = Array.from(t.childNodes);
  nodes.forEach(n => this.cur.appendChild(n));
  if (!this.fits() && this.cur.childNodes.length > nodes.length){ nodes.forEach(n => n.remove()); this.newPage(); nodes.forEach(n => this.cur.appendChild(n)); }
};
Pager.prototype.h1 = function(t, toc){ this.ensure(); if (this.cur.childNodes.length) this.newPage(); if (toc !== false) this.toc.push({t, p:this.pages.length - 1, lvl:toc || 1}); this.html('<h1>' + esc(t) + '</h1>'); };
Pager.prototype.h2 = function(t){ this.html('<h2>' + esc(t) + '</h2>', 90); };
Pager.prototype.h3 = function(t){ this.html('<h3>' + esc(t) + '</h3>', 70); };
Pager.prototype.list = function(items){
  this.ensure(); let ul = document.createElement('ul'); this.cur.appendChild(ul);
  items.forEach(it => { const li = document.createElement('li'); li.innerHTML = nl2br(it); ul.appendChild(li);
    if (!this.fits()){ li.remove(); if (!ul.children.length) ul.remove(); this.newPage(); ul = document.createElement('ul'); this.cur.appendChild(ul); ul.appendChild(li); } });
};
Pager.prototype.table = function(headHTML, rows, cls){
  this.ensure();
  const mk = cont => { const t = document.createElement('table'); if (cls) t.className = cls; t.innerHTML = '<thead>' + headHTML + '</thead><tbody></tbody>'; if (cont){ const c = document.createElement('div'); c.className = 'cap'; c.textContent = '(تابع)'; this.cur.appendChild(c); } this.cur.appendChild(t); return t; };
  if (this.room() < 70 && this.cur.childNodes.length) this.newPage();
  let t = mk(false), tb = t.tBodies[0];
  rows.forEach(r => {
    const tr = document.createElement('tbody'); tr.innerHTML = typeof r === 'string' ? r : r.html; const row = tr.firstChild; tb.appendChild(row);
    if (r.prevKey !== undefined) row.dataset.k = r.prevKey;
    if (!this.fits()){ row.remove(); if (!tb.children.length) t.remove(); this.newPage(); t = mk(true); tb = t.tBodies[0]; tb.appendChild(row); if (row.querySelector('.rep')) { const c = row.querySelector('.rep'); c.classList.remove('rep'); c.innerHTML = c.dataset.full || c.innerHTML; } }
  });
};
Pager.prototype.finish = function(){
  const n = this.pages.length;
  this.pages.forEach((p, i) => { const pn = p.querySelector('.pn'); if (pn) pn.textContent = 'صفحة ' + (i + 1) + ' من ' + n; });
  return this.pages;
};

function ruleRowsFor(S, rowsV, v){
  const cols = [
    {k:'emp', h:'جهة العمل', l:1, f:x => esc(x.r.emp) + (x.r.sub !== ALL ? '<br><span style="color:#666">' + esc(x.r.sub) + '</span>' : '')},
    {k:'job', h:'الوظيفة', l:1, f:x => esc(x.r.job)},
    {k:'gender', h:'الجنس', f:x => esc(x.r.gender)},
    {k:'bank', h:'البنك', f:x => esc(x.r.bank)},
    {k:'product', h:'المنتج', l:1, f:x => esc(x.r.product)},
    {k:'sal', h:'الراتب (د.ك)', f:x => esc(salText(x.r))},
    {k:'svc', h:'مدة الخدمة', f:x => esc(svcText(x.r))},
    {k:'guar', h:'الضمان', l:1, f:x => esc(x.r.guar)},
    {k:'limit', h:'الحد الائتماني', f:x => cellChg(x.limit, x.baseLimit, v)},
    {k:'tenor', h:'مدة الائتمان', f:x => cellChg(x.tenor, x.baseTenor, v)},
    {k:'notes', h:'الضوابط والملاحظات', l:1, f:x => { const n = arr(x.r.rule).concat(arr(x.r.note)); return n.map(t => '• ' + nl2br(t)).join('<br>'); }},
  ];
  const show = cols.filter(c => !['job','gender','bank','product','guar'].includes(c.k) || rowsV.some(x => x.r[c.k] !== ALL));
  const head = '<tr><th>رقم</th>' + show.map(c => '<th>' + c.h + '</th>').join('') + '</tr>';
  let prev = null;
  const rows = rowsV.map(x => {
    const key = x.r.emp + '|' + x.r.sub;
    const tds = show.map(c => {
      const inner = c.f(x) || '—';
      if (c.k === 'emp' && key === prev) return `<td class="l rep" data-full="${esc(inner)}">〃</td>`;
      return `<td class="${c.l ? 'l' : ''}"${c.k === 'notes' ? ' style="max-width:260px;font-size:9px"' : ''}>${inner}</td>`;
    }).join('');
    prev = key;
    return `<tr class="${x.status === 'frozen' ? 'fz' : ''}"><td style="white-space:nowrap">${x.id}${x.status === 'frozen' ? '<br><span class="tag tfz">مجمّد</span>' : ''}</td>${tds}</tr>`;
  });
  return {head, rows};
}
function cellChg(cur, base, v){ return norm(cur) !== norm(base) && v !== 'A' ? `<span class="chg" style="color:${VCOL[v]}">${esc(cur)}</span><span class="was">أ: ${esc(base)}</span>` : esc(cur || '—'); }
function sectionInto(P, s, lvl){
  if (lvl === 1) P.h1(s.title); else { P.h2(s.title); P.toc.push({t:s.title, p:P.pages.length - 1, lvl:2}); }
  s.blocks.forEach(b => {
    if (b.h) P.h3(b.h);
    if (b.kind === 'table') P.table('<tr>' + b.cols.map(c => '<th>' + esc(c) + '</th>').join('') + '</tr>', b.rows.map(r => '<tr>' + r.map((c, i) => `<td class="${i === 0 || String(c).length > 25 ? 'l' : ''}">${esc(c)}</td>`).join('') + '</tr>'));
    else P.list(b.items);
  });
}

    <div class="vnote">${esc(vv.note || '')}</div>
    <div class="cp">${esc(COPYRIGHT)}<br><span dir="ltr">This is an internal document and should not be shared with unauthorized users.</span></div></div>`;
  const natList = S.lists.nat.filter(n => n.v !== ALL && (!natOnly || n.v === natOnly));

    {name:'_rels/.rels', data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'},
    {name:'xl/workbook.xml', data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="الإدخال" sheetId="1" r:id="rId1"/><sheet name="البيانات" sheetId="2" r:id="rId2"/></sheets></workbook>'},
    {name:'xl/_rels/workbook.xml.rels', data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet2.xml"/><Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'},
    {name:'xl/styles.xml', data:styles}, {name:'xl/worksheets/sheet1.xml', data:sheet1}, {name:'xl/worksheets/sheet2.xml', data:sheet2},
  ];
  download('دليل-منح-الائتمان-الإدخال-' + fileDate() + '.xlsx', zipStore(files));
  addLog('تصدير Excel', '', rows.length + ' ضابط'); persist();
}
async function unzip(buf){
  const u = new Uint8Array(buf), dv = new DataView(buf); let e = u.length - 22;
  while (e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
  if (e < 0) throw new Error('zip');
  const cnt = dv.getUint16(e + 10, true); let p = dv.getUint32(e + 16, true); const out = {};
  for (let i = 0; i < cnt; i++){
    const method = dv.getUint16(p + 10, true), csz = dv.getUint32(p + 20, true), nl = dv.getUint16(p + 28, true), xl = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true), lo = dv.getUint32(p + 42, true);
    const name = td.decode(u.subarray(p + 46, p + 46 + nl)); p += 46 + nl + xl + cl;
    const ds = lo + 30 + dv.getUint16(lo + 26, true) + dv.getUint16(lo + 28, true), raw = u.subarray(ds, ds + csz);
    out[name] = {method, raw};
  }
  const read = async n => { const f = out[n]; if (!f) return null; if (f.method === 0) return td.decode(f.raw);
    const s = new Blob([f.raw]).stream().pipeThrough(new DecompressionStream('deflate-raw')); return await new Response(s).text(); };
  return {names:Object.keys(out), read};
}
async function readXlsx(file){
  const z = await unzip(await file.arrayBuffer()), P = new DOMParser();
  const wb = P.parseFromString(await z.read('xl/workbook.xml'), 'application/xml');
  const rels = P.parseFromString(await z.read('xl/_rels/workbook.xml.rels'), 'application/xml');
  const relMap = {}; Array.from(rels.getElementsByTagName('Relationship')).forEach(r => relMap[r.getAttribute('Id')] = r.getAttribute('Target'));
  const ssx = await z.read('xl/sharedStrings.xml'), ss = [];
  if (ssx) Array.from(P.parseFromString(ssx, 'application/xml').getElementsByTagName('si')).forEach(si => ss.push(Array.from(si.getElementsByTagName('t')).map(t => t.textContent).join('')));
  const sheets = {};
  for (const s of Array.from(wb.getElementsByTagName('sheet'))){
    const rid = s.getAttribute('r:id') || s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id');
    let tgt = relMap[rid]; if (!tgt) continue; tgt = tgt.replace(/^\/?xl\//, ''); const x = await z.read('xl/' + tgt.replace(/^\//, '')); if (!x) continue;
    const doc = P.parseFromString(x, 'application/xml'), grid = {};
    Array.from(doc.getElementsByTagName('c')).forEach(c => {
      const ref = c.getAttribute('r'), t = c.getAttribute('t'); const m = ref.match(/^([A-Z]+)(\d+)$/); if (!m) return;
      let v = null; const vv = c.getElementsByTagName('v')[0];
      if (t === 's') v = ss[+vv.textContent]; else if (t === 'inlineStr') v = Array.from(c.getElementsByTagName('t')).map(x => x.textContent).join(''); else if (vv) v = t === 'str' || t === 'b' ? vv.textContent : Number(vv.textContent);
      if (v === null || v === '') return; (grid[+m[2]] = grid[+m[2]] || {})[m[1]] = v;
    });
    sheets[s.getAttribute('name')] = grid;
  }
  return sheets;
}
function headerField(h){
  h = norm(h); if (!h) return null;
  if (h === 'رقم الضابط') return 'id'; if (h === 'الحالة') return 'status'; if (h === 'المرجع' || h === 'صفحة الدليل') return 'src';
  if (h === 'الوظيفة') return 'job';
  if (/^حد خاص \(ب\)/.test(h)) return 'oBL'; if (/^مدة خاصة \(ب\)/.test(h)) return 'oBT'; if (/^حد خاص \(ج\)/.test(h)) return 'oCL'; if (/^مدة خاصة \(ج\)/.test(h)) return 'oCT';
  for (const f of FIELDS) if (norm(XHEAD[f]) === h || norm(FL[f]) === h) return f;
  if (/^الحد الائتماني/.test(h)) return 'limit'; if (/^مدة الائتمان/.test(h)) return 'tenor';
  return null;
}
function splitMulti(s){
  const lines = String(s).split(/\r?\n/), out = [];
  lines.forEach(l => { if (!l.trim()) return; if (/^\s*[-–•]/.test(l) && out.length && /:\s*$|\n/.test(out[out.length - 1] + '\n')) out[out.length - 1] += '\n' + l; else out.push(l.trim()); });
  return out;
}
async function importXlsx(file){
  let sheets; try { sheets = await readXlsx(file); } catch (e) { toast('تعذر قراءة ملف Excel. احفظه بصيغة xlsx وأعد المحاولة.'); return; }
  const name = sheets['الإدخال'] ? 'الإدخال' : Object.keys(sheets).find(n => Object.values(sheets[n]).some(r => Object.values(r).includes('الجنسية')));
  if (!name){ toast('لم أجد ورقة «الإدخال» أو عمود «الجنسية» في الملف'); return; }
  const g = sheets[name], rowsN = Object.keys(g).map(Number).sort((a, b) => a - b);
  const hr = rowsN.find(n => Object.values(g[n]).includes('الجنسية')), map = {};
  Object.entries(g[hr]).forEach(([col, h]) => { const f = headerField(h); if (f) map[col] = f; });
  const stMap = {}; Object.keys(STATUS).forEach(k => stMap[STATUS[k]] = k);
  const recs = rowsN.filter(n => n > hr).map(n => { const o = {}; Object.entries(g[n]).forEach(([c, v]) => { if (map[c]) o[map[c]] = v; }); return o; }).filter(o => o.nat);
  if (!recs.length){ toast('لا توجد صفوف ضوابط في الورقة'); return; }
  const build = (o, id) => {
    const r = Object.assign({id, status:'active', ovr:{}, src:''}, defaultsRule());
    FIELDS.forEach(f => { if (o[f] != null) r[f] = MULTI[f] ? splitMulti(o[f]) : (typeof o[f] === 'number' ? o[f] : String(o[f]).trim()); else if (!MULTI[f] && ['salFrom','salTo','svcFrom','svcTo'].indexOf(f) < 0) r[f] = r[f]; });
    if (o.status && stMap[o.status]) r.status = stMap[o.status]; if (o.src) r.src = String(o.src);
    if (o.oBL || o.oBT) r.ovr.B = {limit:o.oBL ? String(o.oBL) : undefined, tenor:o.oBT ? String(o.oBT) : undefined};
    if (o.oCL || o.oCT) r.ovr.C = {limit:o.oCL ? String(o.oCL) : undefined, tenor:o.oCT ? String(o.oCT) : undefined};
    return r;
  };
  const withId = recs.filter(o => o.id && ruleById(String(o.id))).length;
  sheet('استيراد من Excel', `<p>تم العثور على <b>${recs.length}</b> ضابط في ورقة «${esc(name)}»، منها <b>${withId}</b> برقم ضابط موجود في البرنامج.</p>
    <div class="note">• <b>دمج:</b> يحدّث الضوابط ذات الأرقام الموجودة ويضيف الباقي كضوابط جديدة.<br>• <b>استبدال:</b> يحذف كل الضوابط الحالية ويستبدلها بما في الملف.<br>تُضاف أي قيم جديدة إلى القوائم المنسدلة تلقائياً، ويمكن التراجع عن الاستيراد.</div>`,
    ['<button class="btn pri" data-m="merge">دمج</button>', '<button class="btn danger" data-m="replace">استبدال الكل</button>', '<button class="btn" data-close>إلغاء</button>'],
    (ov, close) => $$('[data-m]', ov).forEach(b => b.onclick = () => { close(); const mode = b.dataset.m;
      mutate('استيراد من Excel', file.name, () => {
        if (mode === 'replace') ST.rules = [];
        let add = 0, upd = 0;
        recs.forEach(o => { const ex = o.id && ruleById(String(o.id));
          if (ex){ const n = build(o, ex.id); Object.assign(ex, n); upd++; addNewValues(ex); }
          else { const n = build(o, o.id && mode === 'replace' ? String(o.id) : nextId(ST)); ST.rules.push(n); addNewValues(n); add++; } });
        const dSheet = sheets['البيانات'];
        if (dSheet){ const hrow = Object.keys(dSheet).map(Number).sort((a, b) => a - b).find(n => Object.values(dSheet[n]).includes('الجنسية'));
          if (hrow){ const cm = {}; Object.entries(dSheet[hrow]).forEach(([c, h]) => { const f = headerField(h); if (f && FIELDS.includes(f)) cm[c] = f; });
            Object.keys(dSheet).map(Number).filter(n => n > hrow).forEach(n => Object.entries(dSheet[n]).forEach(([c, v]) => { const f = cm[c]; if (!f || v === '-') return;
              const L = ST.lists[f]; if (!L.some(x => norm(x.v) === norm(v))){ const i = L.findIndex(x => x.v === ALL); const it = {v, frozen:false}; if (i >= 0) L.splice(i, 0, it); else L.push(it); } })); } }
        toast('تم الاستيراد: ' + add + ' ضابط جديد و' + upd + ' محدّث', 4000);
      }, mode === 'replace' ? 'استبدال كامل: ' + recs.length + ' ضابط' : 'دمج: ' + recs.length + ' ضابط');
    }));
}
